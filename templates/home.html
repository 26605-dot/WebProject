{% extends "layout.html" %}

{% block body %}

<body>
<header class="header">
  <a href="#" class="logo-link">
    <img src="{{ url_for('static', filename='images/your-logo.png') }}" alt="Logo" class="header-logo">
  </a>
<div class="custom-nav-wrapper">
    <nav class="nav-menu">
        <ul>
            <li><a href="/">HOME</a></li>
            <li><a href="{{ url_for('history_page') }}">History</a></li>
            <li><a href="{{ url_for('elements_page') }}">Elements</a></li>
            <li><a href="{{ url_for('diagnosis') }}">Piano Diagnosis</a></li>

        </ul>
    </nav>
</div>
</header>
</body>

<style>
  /* Base Layout Styles */
  .my-content-section {
    width: 90%;
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
  }

  .my-content-section h1 {
    text-align: center;
    font-size: 42px;
    color: #2a4d7a;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .my-content-section h4 {
    text-align: center;
    font-size: 18px;
    color: #557295;
    font-weight: 500;
    margin-bottom: 40px;
  }

  /* Responsive Grid for Piano Cards */
  .three-column {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
  }

  .piano-card-link {
    text-decoration: none;
    color: inherit;
    display: block;
  }

  /* Card Styling (Matching Diagnosis Theme) */
  .w3-card-4 {
    background: #ffffff;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    height: 100%;
  }

  .w3-card-4:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
    border-color: #8cc6ff;
  }

  .w3-card-4 h3 {
    font-size: 20px;
    color: #2a4d7a;
    margin-bottom: 15px;
    font-weight: 600;
  }

  .piano-image {
    width: 90%;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  /* Card Footer / Action Link */
  .more-btn {
    margin-top: auto;
    font-size: 14px;
    font-weight: 700;
    color: #0066cc;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding-top: 10px;
  }

  .w3-card-4:hover .more-btn {
    color: #2a4d7a;
  }
</style>

<div class="grand-image"></div>

<div class="my-content-section">
    <div>
        <h1>PIANO</h1>
        <h4>Here are 12 types of piano below! Click one of them to learn more.</h4>
    </div>

    <div class="three-column">
        {% for result in results %}
        <a href="{{ url_for('piano', id=result[0]) }}" class="piano-card-link">
            <div class="w3-card-4">
                <h3>{{ result[1] }}</h3>
                <img src="{{ result[3] }}" alt="{{ result[2] }}" class="piano-image">
                <div class="more-btn">MORE <span>&gt;</span></div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
